<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3162c9"> <!-- لون شريط عنوان المتصفح -->
<title>صالحة - Image QR Code</title>
<meta property="og:title" content="صالحة - Image QR Code">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
  --bg:light-dark(#f7f2ea,#17140f);      /* لون الخلفية */
  --card:light-dark(#ffffff,#221e18);    /* لون البطاقات */
  --ink:light-dark(#1d1a16,#f3ece0);     /* لون النص */
  --mute:light-dark(#6d655a,#a99f90);    /* لون النص الثانوي */
  --line:light-dark(#e4dbcd,#3a332a);    /* لون الحدود */
  --acc:light-dark(#d9482b,#ff7a5c)}     /* اللون المميز للأزرار */
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Readex Pro",Tahoma,sans-serif;overflow-x:clip} /* الخط والخلفية العامة */
.wrap{max-width:900px;margin:0 auto;padding:clamp(18px,4vw,44px) max(4vw,14px) 60px} /* عرض المحتوى والهوامش */
h1{font-size:clamp(28px,6vw,44px);line-height:1.1;margin:0 0 6px;text-wrap:balance} /* حجم العنوان الرئيسي */
h2{font-size:21px;margin:0 0 12px}                 /* حجم العناوين الفرعية */
p{margin:0 0 12px}
.sub{color:var(--mute);margin-bottom:22px}         /* نص وصفي باهت */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,26px);margin-bottom:20px;box-shadow:0 10px 30px -18px rgb(0 0 0/.35)} /* شكل البطاقة */
label.f{display:block;font-weight:600;margin:10px 0 6px} /* عناوين الحقول */
input[type=text],input[type=email],input[type=password]{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)} /* حقول الإدخال */
input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px} /* إطار التركيز */
.drop{position:relative;display:grid;place-items:center;text-align:center;gap:4px;margin:16px 0;padding:26px 14px;border:2px dashed var(--line);border-radius:16px;cursor:pointer} /* منطقة اختيار الصور */
.drop.on{border-color:var(--acc)}                  /* عند سحب الصور فوقها */
.drop small{color:var(--mute)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px} /* شبكة المصغرات */
.th{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--line)} /* مربع المصغرة */
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th button{position:absolute;top:6px;inset-inline-start:6px;width:32px;height:32px;border-radius:50%;border:0;background:rgb(0 0 0/.6);color:#fff;font-size:18px;cursor:pointer} /* زر حذف المصغرة */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:14px;border:0;font:inherit;font-weight:700;cursor:pointer;background:var(--acc);color:#fff;text-decoration:none} /* الزر الأساسي */
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)} /* الزر الثانوي */
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px} /* صف أزرار */
.msg{color:var(--mute);font-size:15px;margin-top:10px}
.err{color:var(--acc)}                             /* رسائل الخطأ */
.qrbox{display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr);gap:22px;align-items:center} /* تخطيط بطاقة الرمز */
.qrbox canvas{width:100%;height:auto;background:#fff;border-radius:14px;image-rendering:pixelated} /* صورة الرمز */
.link{font-size:13px;color:var(--mute);overflow-wrap:anywhere;direction:ltr;text-align:start} /* الرابط */
.al{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)} /* سطر ألبوم في القائمة */
.al:first-child{border-top:0}
.al img{width:54px;height:54px;border-radius:10px;object-fit:cover;flex:none;background:var(--line)}
.al .t{flex:1}.al .t small{display:block;color:var(--mute)}
.al button{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;cursor:pointer}
body.view{background:#000}                         /* خلفية صفحة الصور للزائر */
body.view .wrap{max-width:900px;padding:0}         /* الصور بعرض الشاشة بلا هوامش */
.gal{display:flex;flex-direction:column;gap:var(--gap,0px)} /* الصور فوق بعض */
.gal img{width:100%;height:auto;display:block}     /* الصورة بحجمها الكامل بدون قص */
.vmsg{color:#fff;text-align:center;padding:60px 16px} /* رسالة الخطأ للزائر */
.choice{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px} /* صف خيارات الشعار */
.choice label{flex:1 1 140px;display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-weight:600} /* زر الخيار */
.choice label:has(input:checked){border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset} /* الخيار المحدد */
.choice input{width:20px;height:20px;accent-color:var(--acc)} /* دائرة الاختيار */
.hidden{display:none!important}
.spin{width:20px;height:20px;border:3px solid rgb(255 255 255/.4);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite} /* مؤشر التحميل */
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
@media(max-width:600px){.qrbox{grid-template-columns:1fr}.qrbox canvas{max-width:270px;margin:0 auto}} /* تخطيط الجوال */
</style>
</head>
<body>
<div class="wrap">

  <div id="loading" class="msg">جارِ التحميل…</div>

  <!-- ========== عرض الألبوم للزائر (بدون تسجيل) ========== -->
  <section id="viewer" class="hidden">
    <div id="gal" class="gal"></div>
    <p id="vmsg" class="vmsg hidden"></p>
  </section>

  <!-- ========== تسجيل دخول صاحب الصفحة ========== -->
  <section id="login" class="hidden">
    <h1>ألبوم الصور</h1>
    <p class="sub">سجّل الدخول لرفع الصور وإنشاء رموز QR.</p>
    <form class="card" id="loginForm">
      <label class="f" for="email">البريد الإلكتروني</label>
      <input id="email" type="email" autocomplete="username" required>
      <label class="f" for="pass">كلمة المرور</label>
      <input id="pass" type="password" autocomplete="current-password" required>
      <div class="row"><button class="btn" type="submit">دخول</button></div>
      <div id="lmsg" class="msg"></div>
    </form>
  </section>

  <!-- ========== لوحة الرفع وإنشاء QR ========== -->
  <section id="maker" class="hidden">
    <h1>ألبوم الصور</h1>
    <p class="sub">ضع صورك ← احصل على QR ← من يمسحه يرى الصور فوراً.</p>

    <div class="card">
      <label class="f" for="title">اسم الألبوم</label>
      <input id="title" type="text" placeholder="مثلاً: رحلة العائلة" maxlength="80">
      <label class="drop" id="drop">
        <input id="file" type="file" accept="image/*" multiple>
        <b>اضغط لاختيار الصور</b>
        <small>أو اسحبها هنا</small>
      </label>
      <div id="thumbs" class="grid"></div>
      <label class="f">شكل الرمز</label>
      <div class="choice">
        <label><input type="radio" name="logoMode" value="1" checked> مع الشعار في المنتصف</label>
        <label><input type="radio" name="logoMode" value="0"> بدون شعار</label>
      </div>
      <div class="row">
        <button id="make" class="btn" disabled>إنشاء رمز QR</button>
        <span id="count" class="msg"></span>
      </div>
      <div id="mmsg" class="msg"></div>
    </div>

    <div id="result" class="card hidden">
      <h2 id="rtitle"></h2>
      <div class="qrbox">
        <canvas id="qr"></canvas>
        <div>
          <p>امسح الرمز بكاميرا الجوال ← تظهر الصور مباشرة.</p>
          <div class="row">
            <a id="save" class="btn" download="qr.png">تنزيل صورة الرمز</a>
            <button id="copy" class="btn ghost">نسخ الرابط</button>
            <a id="open" class="btn ghost" target="_blank" rel="noopener">فتح الألبوم</a>
          </div>
          <p id="rlink" class="link" style="margin-top:12px"></p>
          <div id="rmsg" class="msg"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>ألبوماتي</h2>
      <div id="albums"><p class="msg">جارِ التحميل…</p></div>
    </div>
    <button id="logout" class="btn ghost">تسجيل الخروج</button>
  </section>
</div>


<script>
{
// ================= الإعدادات — غيّر هذه فقط =================
const SUPABASE_URL      = "https://cpbechswwgbcvevypjlx.supabase.co"; // Project URL
const SUPABASE_ANON_KEY = "sb_publishable_Zs-VlCavmJK4sJBklxd8gA_xKZo_9ya"; // publishable key
const BUCKET            = "albums";                           // اسم الـ bucket
const LOGO_FILE         = "1795376222089.jpg";                // اسم ملف الشعار في المستودع — لتغيير الشعار ارفع ملفاً جديداً وضع اسمه هنا
const PATH_PREFIX       = "ar/data/image-pack/";              // شكل رابط الألبوم بعد عنوان الموقع

// ================= ثوابت قابلة للتعديل =================
const MAX_SIDE       = 1600;   // أقصى بُعد للصورة بعد الضغط (بكسل)
const JPEG_QUALITY   = 0.85;   // جودة الضغط
const MAX_PHOTOS     = 200;    // أقصى عدد صور في الألبوم الواحد
const UPLOAD_RETRIES = 4;      // عدد محاولات رفع كل صورة قبل التوقف
const UPLOAD_TIMEOUT_MS = 60000; // أقصى وقت لرفع صورة واحدة قبل إعادة المحاولة (مللي ثانية)
const RETRY_DELAY_MS = 2000;   // الانتظار بين المحاولات، يزيد مع كل محاولة (مللي ثانية)
const PHOTO_GAP_PX   = 0;      // المسافة بين الصور عند العرض (بكسل)
const EAGER_PHOTOS   = 3;      // عدد الصور التي تُحمَّل فوراً، والباقي عند التمرير
const QR_CELL        = 10;     // حجم مربع QR (بكسل)
const QR_MARGIN      = 4;      // الهامش حول الرمز (مربعات)
const QR_LEVEL       = "H";    // مستوى تصحيح الأخطاء — H يسمح بوضع شعار في الوسط
const LOGO_SCALE     = 0.10;   // حجم الشعار نسبةً لعرض الرمز (لا تتجاوز 0.25)
const LOGO_PAD       = 0.12;   // الحافة البيضاء حول الشعار (نسبةً لحجمه)
const LOGO_RADIUS    = 0.22;   // استدارة زوايا الخلفية البيضاء (نسبةً لحجمها)
const TRIM_WHITE     = 240;    // قص الحواف البيضاء حول الشعار: أي لون أفتح من هذا يُعتبر فراغاً
const SETTINGS_DIR   = "_settings"; // مجلد قديم للإعدادات في Supabase (يُستثنى من قائمة الألبومات)
const PREF_LOGO_KEY  = "qr-with-logo"; // مفتاح حفظ خيار الشعار في المتصفح
const ID_LENGTH      = 10;     // طول معرّف الألبوم
const CACHE_SECONDS  = "31536000"; // مدة التخزين المؤقت للصور
const SUPABASE_JS    = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js";
const QR_JS          = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";

// عنوان الموقع الأساسي، يُحسب تلقائياً من الرابط الحالي
const pathNow  = location.pathname;
const cut      = pathNow.indexOf("/" + PATH_PREFIX);
const SITE_URL = location.origin + (cut >= 0 ? pathNow.slice(0, cut + 1) : pathNow.replace(/[^/]*$/, ""));
const PUBLIC   = `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/`;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const show = id => { for (const s of ["loading","viewer","login","maker"]) $(s).classList.toggle("hidden", s !== id); };
const loadScript = src => new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
const newId = () => { const a = "abcdefghijkmnpqrstuvwxyz23456789", r = crypto.getRandomValues(new Uint8Array(ID_LENGTH)); return [...r].map(x => a[x % a.length]).join(""); };
const albumLink = id => SITE_URL + PATH_PREFIX + id;

// ================= وضع الزائر: الصور فوق بعض مباشرة =================
async function openViewer(id) {
  document.body.classList.add("view");
  $("gal").style.setProperty("--gap", PHOTO_GAP_PX + "px");
  show("viewer");
  try {
    const r = await fetch(PUBLIC + id + "/meta.json", { cache: "no-cache" });
    if (!r.ok) throw 0;
    const m = await r.json();
    $("gal").innerHTML = (m.files || []).map((f, i) =>
      `<img src="${esc(PUBLIC + id + "/" + f)}" alt="" ${i >= EAGER_PHOTOS ? 'loading="lazy"' : ""}>`).join("");
  } catch {
    $("vmsg").textContent = "الألبوم غير موجود";
    $("vmsg").classList.remove("hidden");
  }
}

// ================= وضع صاحب الصفحة =================
let sb = null, picked = [], current = null, albumsCache = [];
let logoImg = null, logoReady = null;

// تحميل الشعار من المستودع، مع قص الحواف البيضاء أو الشفافة حتى يتوسط الرمز تماماً
function trimLogo(img) {
  const c = document.createElement("canvas");
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const x = c.getContext("2d"); x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height).data;
  let t = c.height, b = -1, l = c.width, r = -1;
  for (let y = 0; y < c.height; y++) for (let k = 0; k < c.width; k++) {
    const i = (y * c.width + k) * 4;
    const filled = d[i + 3] > 16 && (d[i] < TRIM_WHITE || d[i + 1] < TRIM_WHITE || d[i + 2] < TRIM_WHITE);
    if (filled) { if (y < t) t = y; if (y > b) b = y; if (k < l) l = k; if (k > r) r = k; }
  }
  if (b < 0) return c;
  const o = document.createElement("canvas");
  o.width = r - l + 1; o.height = b - t + 1;
  o.getContext("2d").drawImage(c, l, t, o.width, o.height, 0, 0, o.width, o.height);
  return o;
}
function loadLogo(src) {
  const img = new Image(); img.src = src;
  logoReady = img.decode().then(() => {
    try { logoImg = trimLogo(img); } catch { logoImg = img; }
  }).catch(() => { logoImg = null; });
  return logoReady;
}
const withLogo = () => document.querySelector('input[name="logoMode"]:checked')?.value !== "0";

async function startOwner() {
  loadLogo(SITE_URL + LOGO_FILE);
  try { if (localStorage.getItem(PREF_LOGO_KEY) === "0") document.querySelector('input[name="logoMode"][value="0"]').checked = true; } catch {}
  try { await Promise.all([loadScript(SUPABASE_JS), loadScript(QR_JS)]); }
  catch { $("loading").textContent = "تعذّر تحميل المكتبات. تحقق من الاتصال."; return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data } = await sb.auth.getSession();
  if (data.session) enterMaker(); else show("login");
}

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("lmsg").textContent = "…"; $("lmsg").className = "msg";
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pass").value });
  if (error) { $("lmsg").textContent = "البريد أو كلمة المرور غير صحيحة."; $("lmsg").className = "msg err"; return; }
  enterMaker();
});
$("logout").addEventListener("click", async () => { await sb.auth.signOut(); show("login"); });

function enterMaker() { show("maker"); listAlbums(); }

// --- خيار الشعار: مع أو بدون، ويُطبَّق فوراً على الرمز المعروض ---
document.querySelectorAll('input[name="logoMode"]').forEach(r => r.addEventListener("change", () => {
  try { localStorage.setItem(PREF_LOGO_KEY, withLogo() ? "1" : "0"); } catch {}
  if (current) showResult(current, false);
}));

// --- فتح الصورة: بطريقتين، لأن بعض الجوالات تفشل في الأولى ---
async function decodeImage(file) {
  try { return await createImageBitmap(file); } catch {}
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url;
    await img.decode();
    return img;
  } finally { setTimeout(() => URL.revokeObjectURL(url), 0); }
}

// --- ضغط الصورة قبل الرفع؛ تعيد null إن تعذّر فتحها (صيغة غير مدعومة أو صورة في السحابة فقط) ---
async function shrink(file) {
  let src;
  try { src = await decodeImage(file); } catch { return null; }
  const w = src.width || src.naturalWidth, hgt = src.height || src.naturalHeight;
  if (!w || !hgt) return null;
  const s = Math.min(1, MAX_SIDE / Math.max(w, hgt));
  const c = document.createElement("canvas");
  c.width = Math.round(w * s); c.height = Math.round(hgt * s);
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  src.close?.();                                    // تحرير ذاكرة الصورة الأصلية
  const b = await new Promise(r => c.toBlob(r, "image/jpeg", JPEG_QUALITY));
  c.width = c.height = 0;                           // تحرير ذاكرة اللوحة
  return b ? { blob: b, ext: "jpg", type: "image/jpeg" } : null;
}

// --- اختيار الصور ---
function addFiles(list) {
  if (pending) { $("mmsg").textContent = "أكمل رفع الألبوم الحالي أولاً."; return; }
  for (const f of list) {
    if (!f.type.startsWith("image/") || picked.length >= MAX_PHOTOS) continue;
    picked.push({ file: f, url: URL.createObjectURL(f) });
  }
  renderPicked();
}
function renderPicked() {
  $("thumbs").innerHTML = picked.map((p, i) =>
    `<div class="th"><img src="${p.url}" alt=""><button data-i="${i}" aria-label="حذف">×</button></div>`).join("");
  $("count").textContent = picked.length ? `${picked.length} صورة` : "";
  $("make").disabled = !picked.length;
}
$("file").addEventListener("change", e => { addFiles(e.target.files); e.target.value = ""; });
const drop = $("drop");
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("on"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("on"); }));
drop.addEventListener("drop", e => addFiles(e.dataTransfer.files));
$("thumbs").addEventListener("click", e => {
  const i = e.target.dataset?.i; if (i == null || pending) return;
  URL.revokeObjectURL(picked[i].url); picked.splice(+i, 1); renderPicked();
});

// --- رفع ملف واحد مع مهلة زمنية وإعادة محاولة تلقائية ---
const wait = ms => new Promise(r => setTimeout(r, ms));
async function uploadFile(path, blob, type, cache) {
  for (let attempt = 1; attempt <= UPLOAD_RETRIES; attempt++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), UPLOAD_TIMEOUT_MS);
    try {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) throw Object.assign(new Error("انتهت الجلسة، سجّل الدخول مرة أخرى"), { fatal: true });
      const r = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`, {
        method: "POST",
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${session.access_token}`,
                   "Content-Type": type || "application/octet-stream", "cache-control": `max-age=${cache}` },
        body: blob, signal: ctrl.signal
      });
      clearTimeout(timer);
      if (r.ok) return;
      const txt = await r.text();
      if (r.status === 409 || /exists|duplicate/i.test(txt)) return;   // رُفع في محاولة سابقة
      throw new Error(txt.slice(0, 120) || "HTTP " + r.status);
    } catch (err) {
      clearTimeout(timer);
      if (err.fatal || attempt === UPLOAD_RETRIES) throw err;
      await wait(RETRY_DELAY_MS * attempt);
    }
  }
}

// --- إنشاء الألبوم: يرفع صورة صورة، وإن انقطع الاتصال يكمل من حيث توقف ---
let pending = null;   // { id, title, files, skipped, next } ألبوم لم يكتمل رفعه
let wakeLock = null;
$("make").addEventListener("click", async () => {
  const btn = $("make"); btn.disabled = true; $("mmsg").className = "msg"; $("mmsg").textContent = "";
  if (!pending) pending = { id: newId(), title: $("title").value.trim() || "ألبوم صور", files: [], skipped: [], next: 0 };
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}   // إبقاء الشاشة مضاءة أثناء الرفع
  try {
    for (let i = pending.next; i < picked.length; i++) {
      btn.innerHTML = `<span class="spin"></span> رفع ${i + 1} من ${picked.length}`;
      const s = await shrink(picked[i].file);
      if (!s) { pending.skipped.push(i + 1); pending.next = i + 1; continue; }   // صورة لا يمكن فتحها: تُتخطى
      const name = `${String(i + 1).padStart(3, "0")}.${s.ext}`;
      await uploadFile(`${pending.id}/${name}`, s.blob, s.type, CACHE_SECONDS);
      pending.files.push(name);
      pending.next = i + 1;
    }
    if (!pending.files.length) throw Object.assign(new Error("لم يمكن فتح أي صورة"), { noResume: true });
    btn.textContent = "حفظ…";
    const meta = new Blob([JSON.stringify({ title: pending.title, files: pending.files, created: Date.now() })], { type: "application/json" });
    await uploadFile(`${pending.id}/meta.json`, meta, "application/json", "60");
    const done = { id: pending.id, title: pending.title };
    const skipped = pending.skipped;
    pending = null;
    for (const p of picked) URL.revokeObjectURL(p.url);
    picked = []; renderPicked(); $("title").value = "";
    btn.textContent = "إنشاء رمز QR";
    showResult(done);
    listAlbums();
    if (skipped.length) {
      $("mmsg").className = "msg err";
      $("mmsg").textContent = `تم إنشاء الألبوم، لكن تُخطّيت الصور رقم ${skipped.join("، ")} لأن الجوال لم يستطع فتحها. قد تكون صيغتها غير مدعومة (مثل HEIC) أو موجودة في السحابة فقط وغير منزّلة على الجوال.`;
    }
  } catch (err) {
    $("mmsg").className = "msg err";
    if (err?.noResume) {
      $("mmsg").textContent = "تعذّر فتح الصور المختارة. جرّب صوراً بصيغة JPG أو PNG موجودة على الجوال.";
      pending = null; btn.textContent = "إنشاء رمز QR";
    } else {
      $("mmsg").textContent = `توقف الرفع عند الصورة ${pending.next + 1} من ${picked.length} (${err?.message || "انقطع الاتصال"}). تأكد من الإنترنت ثم اضغط «متابعة الرفع» ليكمل من حيث توقف.`;
      btn.textContent = "متابعة الرفع";
    }
  }
  try { await wakeLock?.release(); } catch {}
  btn.disabled = !picked.length;
});

// --- رسم QR ---
async function drawQR(text) {
  const q = qrcode(0, QR_LEVEL); q.addData(text); q.make();
  const n = q.getModuleCount(), size = (n + QR_MARGIN * 2) * QR_CELL;
  const c = $("qr"); c.width = size; c.height = size;
  const x = c.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, size, size); x.fillStyle = "#000";
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++)
    if (q.isDark(r, k)) x.fillRect((k + QR_MARGIN) * QR_CELL, (r + QR_MARGIN) * QR_CELL, QR_CELL, QR_CELL);
  // --- الشعار في المنتصف ---
  await logoReady;
  if (withLogo() && logoImg && logoImg.width) {
    const qrSide = n * QR_CELL;                        // عرض الرمز بدون الهامش
    const lw = qrSide * LOGO_SCALE;
    const lh = lw * logoImg.height / logoImg.width;
    const pad = lw * LOGO_PAD, bw = lw + pad * 2, bh = lh + pad * 2;
    const bx = (size - bw) / 2, by = (size - bh) / 2;
    x.fillStyle = "#fff";
    x.beginPath(); x.roundRect(bx, by, bw, bh, Math.min(bw, bh) * LOGO_RADIUS); x.fill();
    x.drawImage(logoImg, (size - lw) / 2, (size - lh) / 2, lw, lh);
  }
  return c.toDataURL("image/png");
}
async function showResult(a, scroll = true) {
  current = a;
  const link = albumLink(a.id);
  $("rtitle").textContent = a.title;
  $("rlink").textContent = link;
  $("open").href = link;
  $("save").href = await drawQR(link);
  $("save").download = `qr-${a.title}.png`;
  $("rmsg").textContent = "";
  $("result").classList.remove("hidden");
  if (scroll) $("result").scrollIntoView({ behavior: "smooth", block: "start" });
}
$("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(albumLink(current.id)); $("rmsg").textContent = "تم نسخ الرابط."; }
  catch { $("rmsg").textContent = "انسخ الرابط الظاهر يدوياً."; }
});

// --- قائمة الألبومات ---
async function listAlbums() {
  const { data, error } = await sb.storage.from(BUCKET).list("", { limit: 1000 });
  if (error) { $("albums").innerHTML = `<p class="msg err">تعذّر جلب القائمة.</p>`; return; }
  const ids = data.filter(d => !d.id && d.name !== SETTINGS_DIR).map(d => d.name); // المجلدات فقط، عدا الإعدادات
  const metas = await Promise.all(ids.map(id =>
    fetch(PUBLIC + id + "/meta.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : null).catch(() => null)
      .then(m => m && { id, ...m })));
  albumsCache = metas.filter(Boolean).sort((a, b) => (b.created || 0) - (a.created || 0));
  $("albums").innerHTML = albumsCache.length ? albumsCache.map(a => `
    <div class="al">
      <img src="${esc(a.files?.[0] ? PUBLIC + a.id + "/" + a.files[0] : "")}" alt="" loading="lazy">
      <div class="t"><b>${esc(a.title)}</b><small>${a.files?.length || 0} صورة</small></div>
      <button data-qr="${esc(a.id)}">QR</button>
      <button data-del="${esc(a.id)}">حذف</button>
    </div>`).join("") : `<p class="msg">لا توجد ألبومات بعد.</p>`;
}
$("albums").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.qr) { const a = albumsCache.find(x => x.id === b.dataset.qr); if (a) showResult(a); return; }
  if (b.dataset.del) {
    if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "متأكد؟"; return; }
    const id = b.dataset.del, a = albumsCache.find(x => x.id === id);
    const paths = [...(a?.files || []), "meta.json"].map(f => `${id}/${f}`);
    const { error } = await sb.storage.from(BUCKET).remove(paths);
    if (error) { b.textContent = "فشل"; return; }
    if (current?.id === id) $("result").classList.add("hidden");
    listAlbums();
  }
});

// ================= البدء =================
// يقبل الشكل الجديد (.../image-pack/ID) والقديم (?a=ID)
const pathId  = (pathNow.match(/\/image-pack\/([a-z0-9]+)\/?$/) || [])[1];
const albumId = pathId || new URLSearchParams(location.search).get("a");
if (albumId && /^[a-z0-9]+$/.test(albumId)) openViewer(albumId);
else startOwner();
}
