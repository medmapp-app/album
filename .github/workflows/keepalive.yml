name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"   # كل 3 أيام الساعة 6:17 صباحاً بتوقيت UTC
  workflow_dispatch:          # يسمح بتشغيلها يدوياً للتجربة

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://cpbechswwgbcvevypjlx.supabase.co
          SUPABASE_KEY: sb_publishable_Zs-VlCavmJK4sJBklxd8gA_xKZo_9ya
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Supabase replied: HTTP $code"
          test "$code" = "200"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep GitHub schedule alive
        env:
          MAX_DAYS: 45   # عدد الأيام قبل حفظ تغيير تلقائي في المستودع
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "Days since last commit: $days"
          if [ "$days" -ge "$MAX_DAYS" ]; then
            date -u > last-ping.txt
            git config user.name "keepalive-bot"
            git config user.email "keepalive-bot@users.noreply.github.com"
            git add last-ping.txt
            git commit -m "keepalive"
            git push
          fi
